<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHIEF Reel Visual - Premium</title>
  <style>
    :root {
      --ink: #f6f4ef;
      --char: #101419;
      --slate: #1f2937;
      --bronze: #c08552;
      --sand: #f0dfc0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(700px 500px at 75% 15%, rgba(192, 133, 82, 0.24), transparent 60%),
        radial-gradient(1000px 700px at 20% 95%, rgba(240, 223, 192, 0.16), transparent 60%),
        linear-gradient(170deg, #121826, #0f1318 45%, #0b1014);
    }

    .frame {
      width: min(100vw, 1080px);
      aspect-ratio: 9 / 16;
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(240, 223, 192, 0.35);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
      background: linear-gradient(180deg, #151a23 0%, #0c1118 100%);
    }

    .panel {
      position: absolute;
      inset: 3.2% 6%;
      border: 1px solid rgba(240, 223, 192, 0.28);
      border-radius: 24px;
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.03), rgba(192, 133, 82, 0.05));
    }

    .line {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 14%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(240, 223, 192, 0.65), transparent);
    }

    .crest {
      position: absolute;
      top: 16.5%;
      left: 50%;
      transform: translateX(-50%);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-family: "Trebuchet MS", sans-serif;
      font-weight: 700;
      font-size: clamp(13px, 1.1vw, 19px);
      color: #d8cbb6;
    }

    .logo {
      position: absolute;
      width: 35%;
      max-width: 360px;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.55));
      animation: floaty 3s ease-in-out infinite;
    }

    .headline {
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: 31%;
      text-align: center;
      text-transform: uppercase;
      line-height: 1.02;
    }

    .headline .l1 {
      display: block;
      font-size: clamp(40px, 5.2vw, 74px);
      letter-spacing: 0.05em;
      color: #ede5d8;
    }

    .headline .l2 {
      display: block;
      margin-top: 10px;
      font-size: clamp(52px, 6.6vw, 96px);
      letter-spacing: 0.04em;
      color: var(--sand);
    }

    .sub {
      position: absolute;
      left: 11%;
      right: 11%;
      bottom: 18%;
      text-align: center;
      font-family: "Trebuchet MS", sans-serif;
      font-size: clamp(20px, 2vw, 30px);
      color: #d6dee8;
      line-height: 1.25;
    }

    .cta {
      position: absolute;
      left: 50%;
      bottom: 8.5%;
      transform: translateX(-50%);
      border: 1px solid rgba(240, 223, 192, 0.65);
      color: #f7efdf;
      border-radius: 999px;
      padding: 12px 24px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: "Trebuchet MS", sans-serif;
      font-weight: 700;
      font-size: clamp(16px, 1.4vw, 24px);
      background: rgba(9, 12, 18, 0.5);
    }

    @keyframes floaty {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-10px); }
    }

    @media (max-width: 740px) {
      .frame { width: 100vw; border-radius: 0; }
      .logo { width: 45%; }
      .headline { bottom: 29%; }
    }
  </style>
</head>
<body>
  <main class="frame" aria-label="CHIEF Reel Premium Visual">
    <div class="panel"></div>
    <div class="line"></div>
    <div class="crest">Chief Token • Base Network</div>

    <img class="logo" src="../chief-coin-256.png" alt="CHIEF token logo" />

    <h1 class="headline">
      <span class="l1">Process Over Noise</span>
      <span class="l2">Signal Over Hype</span>
    </h1>

    <p class="sub">Join a community built for disciplined execution and long-term utility.</p>

    <div class="cta">Follow @officialchieftoken</div>
  </main>
</body>
</html>
