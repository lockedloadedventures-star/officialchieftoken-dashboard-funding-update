<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHIEF Reel Visual - Hype</title>
  <style>
    :root {
      --ink: #f8fafc;
      --hot: #ef4444;
      --warm: #f59e0b;
      --cool: #22d3ee;
      --dark: #09090b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      background:
        radial-gradient(900px 600px at 10% 10%, rgba(239, 68, 68, 0.33), transparent 60%),
        radial-gradient(900px 600px at 90% 90%, rgba(34, 211, 238, 0.28), transparent 60%),
        linear-gradient(155deg, #09090b, #1f2937 45%, #0f172a);
    }

    .frame {
      width: min(100vw, 1080px);
      aspect-ratio: 9 / 16;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      background: linear-gradient(180deg, #111827 0%, #030712 100%);
    }

    .streak, .streak2 {
      position: absolute;
      inset: -20% -20%;
      background: conic-gradient(from 0deg, rgba(239, 68, 68, 0), rgba(239, 68, 68, 0.5), rgba(245, 158, 11, 0.55), rgba(34, 211, 238, 0.45), rgba(239, 68, 68, 0));
      filter: blur(28px);
      animation: spin 8s linear infinite;
      opacity: 0.55;
    }

    .streak2 {
      animation-direction: reverse;
      animation-duration: 11s;
      opacity: 0.34;
    }

    .noise {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.13) 0.7px, transparent 0.7px);
      background-size: 3px 3px;
      opacity: 0.06;
      mix-blend-mode: soft-light;
    }

    .tag {
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 3;
      background: linear-gradient(90deg, var(--hot), var(--warm));
      color: #111827;
      font-family: "Trebuchet MS", sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: clamp(16px, 1.4vw, 24px);
    }

    .headline {
      position: absolute;
      top: 11%;
      left: 5.5%;
      right: 5.5%;
      z-index: 4;
      line-height: 0.9;
      text-transform: uppercase;
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
    }

    .headline span { display: block; }
    .h1 { font-size: clamp(58px, 7.2vw, 112px); color: #f8fafc; animation: slam 0.45s ease both; }
    .h2 { font-size: clamp(84px, 10vw, 150px); color: var(--warm); animation: slam 0.45s ease 0.15s both; }
    .h3 { font-size: clamp(64px, 7.8vw, 120px); color: var(--cool); animation: slam 0.45s ease 0.3s both; }

    .logo {
      position: absolute;
      width: 45%;
      max-width: 440px;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      z-index: 3;
      filter: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.68));
      animation: thump 1.4s ease-in-out infinite;
    }

    .sub {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 20%;
      z-index: 4;
      font-family: "Trebuchet MS", sans-serif;
      font-size: clamp(24px, 2.4vw, 38px);
      font-weight: 800;
      line-height: 1.2;
      color: #e2e8f0;
    }

    .cta {
      position: absolute;
      left: 50%;
      bottom: 9%;
      transform: translateX(-50%);
      z-index: 5;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 900;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      padding: 12px 24px;
      font-size: clamp(22px, 2.1vw, 34px);
      background: rgba(2, 6, 23, 0.45);
      animation: flash 1s steps(2) infinite;
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes slam {
      from { transform: scale(1.3) translateY(-8px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes thump {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.07); }
    }
    @keyframes flash {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.65; }
    }

    @media (max-width: 740px) {
      .frame { width: 100vw; border-radius: 0; }
      .logo { width: 52%; top: 48%; }
    }
  </style>
</head>
<body>
  <main class="frame" aria-label="CHIEF Reel Hype Visual">
    <div class="streak"></div>
    <div class="streak2"></div>
    <div class="tag">CHIEF ON BASE</div>

    <h1 class="headline">
      <span class="h1">Most People</span>
      <span class="h2">Are Late</span>
      <span class="h3">Don't Be</span>
    </h1>

    <img class="logo" src="../chief-coin-256.png" alt="CHIEF token logo" />

    <p class="sub">Early movers win attention first. Follow now and stay in front of the wave.</p>

    <div class="cta">Follow @officialchieftoken</div>

    <div class="noise"></div>
  </main>
</body>
</html>
