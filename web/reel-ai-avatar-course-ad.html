<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Avatar Crash Course Reel Ad</title>
  <style>
    :root {
      --ink: #f8fafc;
      --night: #060b16;
      --night-2: #111827;
      --mint: #34d399;
      --sky: #38bdf8;
      --sun: #f59e0b;
      --rose: #fb7185;
      --panel: rgba(9, 15, 28, 0.72);
      --line: rgba(248, 250, 252, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: "Arial Black", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(56, 189, 248, 0.2), transparent 60%),
        radial-gradient(1000px 700px at 85% 90%, rgba(251, 113, 133, 0.2), transparent 60%),
        linear-gradient(145deg, var(--night), var(--night-2) 48%, #0f172a);
    }

    .reel {
      width: min(100vw, 1080px);
      aspect-ratio: 9 / 16;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.58);
      isolation: isolate;
      background:
        radial-gradient(circle at 25% 18%, rgba(56, 189, 248, 0.2), transparent 35%),
        radial-gradient(circle at 82% 82%, rgba(245, 158, 11, 0.18), transparent 35%),
        linear-gradient(180deg, #050916 0%, #0b1325 100%);
    }

    .scan {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.32;
      animation: drift 16s linear infinite;
    }

    .chip {
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 5;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: clamp(14px, 1.2vw, 20px);
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--mint), var(--sky));
      color: #07111f;
      font-weight: 900;
    }

    .hook {
      position: absolute;
      top: 11%;
      left: 6.5%;
      right: 6.5%;
      text-transform: uppercase;
      line-height: 0.93;
      text-shadow: 0 9px 22px rgba(0, 0, 0, 0.55);
      z-index: 6;
    }

    .hook span { display: block; }
    .h1 { font-size: clamp(52px, 6.8vw, 98px); color: #e2e8f0; animation: pop 0.55s ease both; }
    .h2 { font-size: clamp(72px, 8.6vw, 124px); color: var(--mint); animation: pop 0.55s ease 0.12s both; }
    .h3 { font-size: clamp(58px, 7vw, 106px); color: var(--sun); animation: pop 0.55s ease 0.24s both; }

    .tiers {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 42%;
      display: grid;
      gap: 10px;
      z-index: 6;
      font-family: "Segoe UI", sans-serif;
      animation: rise 0.8s ease 0.4s both;
    }

    .tier {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
      padding: 10px 14px;
      backdrop-filter: blur(4px);
    }

    .tier strong {
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: clamp(15px, 1.3vw, 22px);
    }

    .tier em {
      font-style: normal;
      color: #cbd5e1;
      font-size: clamp(12px, 1.05vw, 17px);
      margin-left: 10px;
    }

    .price {
      font-family: "Arial Black", sans-serif;
      font-size: clamp(22px, 2.2vw, 34px);
    }

    .starter .price { color: #e2e8f0; }
    .growth .price { color: var(--sky); }
    .pro .price { color: var(--sun); }

    .sub {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 18%;
      z-index: 6;
      font-family: "Segoe UI", sans-serif;
      font-weight: 700;
      line-height: 1.2;
      color: #e2e8f0;
      font-size: clamp(21px, 2.2vw, 34px);
      text-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
      animation: rise 0.8s ease 0.55s both;
    }

    .cta {
      position: absolute;
      left: 50%;
      bottom: 8.5%;
      transform: translateX(-50%);
      z-index: 7;
      border-radius: 999px;
      padding: 12px 24px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: clamp(16px, 1.5vw, 25px);
      font-weight: 900;
      background: rgba(6, 11, 22, 0.6);
      animation: blink 1.1s steps(2) infinite;
    }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 8;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      padding: 7px 10px;
      font-size: clamp(10px, 0.9vw, 14px);
      color: #cbd5e1;
      background: rgba(2, 6, 15, 0.88);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 9;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 0.6px, transparent 0.6px);
      background-size: 3px 3px;
      opacity: 0.05;
      mix-blend-mode: soft-light;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-48px); }
    }

    @keyframes pop {
      from { transform: scale(1.15) translateY(-6px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    @keyframes rise {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.68; }
    }

    @media (max-width: 740px) {
      .reel { width: 100vw; border-radius: 0; }
      .tiers { top: 41%; }
      .sub { bottom: 17%; }
    }
  </style>
</head>
<body>
  <main class="reel" aria-label="AI Avatar Course Reel Ad">
    <div class="scan"></div>

    <div class="chip">New Course</div>

    <h1 class="hook">
      <span class="h1">Build Your</span>
      <span class="h2">AI Avatar</span>
      <span class="h3">Business</span>
    </h1>

    <section class="tiers" aria-label="Pricing tiers">
      <div class="tier starter">
        <div>
          <strong>Starter</strong>
          <em>Core course + templates</em>
        </div>
        <div class="price">$40</div>
      </div>

      <div class="tier growth">
        <div>
          <strong>Growth</strong>
          <em>Prompt vault + 30-day calendar</em>
        </div>
        <div class="price">$100</div>
      </div>

      <div class="tier pro">
        <div>
          <strong>Pro</strong>
          <em>Monetization playbook + funnel pack</em>
        </div>
        <div class="price">$200</div>
      </div>
    </section>

    <p class="sub">No coding. Clear system. Start this week.</p>

    <div class="cta">Enroll on Gumroad</div>

    <div class="footer">Educational content only. Results vary. No guaranteed income.</div>

    <div class="grain"></div>
  </main>
</body>
</html>
