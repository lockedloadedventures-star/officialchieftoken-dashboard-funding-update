<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Avatar Course Ad Square</title>
  <style>
    :root {
      --ink: #f8fafc;
      --mint: #34d399;
      --sky: #38bdf8;
      --sun: #f59e0b;
      --panel: rgba(8, 15, 28, 0.78);
      --line: rgba(248, 250, 252, 0.26);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Arial Black", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(56, 189, 248, 0.22), transparent 60%),
        radial-gradient(700px 500px at 90% 85%, rgba(245, 158, 11, 0.2), transparent 60%),
        linear-gradient(150deg, #060b16, #0e1729 52%, #111827);
    }

    .square {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 18% 14%, rgba(56, 189, 248, 0.2), transparent 36%),
        radial-gradient(circle at 86% 88%, rgba(52, 211, 153, 0.14), transparent 38%),
        linear-gradient(180deg, #050916 0%, #0b1325 100%);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      opacity: 0.26;
      animation: drift 13s linear infinite;
    }

    .chip {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 4;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 7px 11px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--mint), var(--sky));
      color: #07111f;
      font-weight: 900;
    }

    .hook {
      position: absolute;
      top: 13%;
      left: 6%;
      right: 6%;
      z-index: 5;
      text-transform: uppercase;
      line-height: 0.94;
      text-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
    }

    .hook span { display: block; }
    .h1 { font-size: clamp(30px, 6.6vw, 44px); color: #e2e8f0; }
    .h2 { font-size: clamp(42px, 9vw, 58px); color: var(--mint); }
    .h3 { font-size: clamp(34px, 7.2vw, 50px); color: var(--sun); }

    .tiers {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 41%;
      display: grid;
      gap: 8px;
      z-index: 5;
      font-family: "Segoe UI", sans-serif;
    }

    .tier {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      padding: 8px 11px;
      backdrop-filter: blur(3px);
    }

    .tier strong {
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 14px;
    }

    .tier em {
      display: block;
      font-style: normal;
      color: #cbd5e1;
      font-size: 11px;
      margin-top: 2px;
    }

    .price {
      font-size: 24px;
      line-height: 1;
    }

    .starter .price { color: #e2e8f0; }
    .growth .price { color: var(--sky); }
    .pro .price { color: var(--sun); }

    .sub {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 16%;
      z-index: 5;
      font-family: "Segoe UI", sans-serif;
      font-size: clamp(16px, 3.1vw, 24px);
      font-weight: 700;
      color: #e2e8f0;
      line-height: 1.2;
    }

    .cta {
      position: absolute;
      left: 50%;
      bottom: 7.8%;
      transform: translateX(-50%);
      z-index: 6;
      border-radius: 999px;
      padding: 9px 16px;
      border: 2px solid rgba(255, 255, 255, 0.82);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      font-weight: 900;
      background: rgba(6, 11, 22, 0.62);
      animation: blink 1.1s steps(2) infinite;
      white-space: nowrap;
    }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 7;
      text-align: center;
      padding: 5px 8px;
      font-family: "Segoe UI", sans-serif;
      font-size: 9px;
      color: #cbd5e1;
      background: rgba(2, 6, 15, 0.88);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 0.6px, transparent 0.6px);
      background-size: 3px 3px;
      opacity: 0.05;
      mix-blend-mode: soft-light;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-34px); }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.66; }
    }
  </style>
</head>
<body>
  <main class="square" aria-label="AI Avatar Course Square Ad">
    <div class="grid"></div>
    <div class="chip">New Course</div>

    <h1 class="hook">
      <span class="h1">Build Your</span>
      <span class="h2">AI Avatar</span>
      <span class="h3">Business</span>
    </h1>

    <section class="tiers" aria-label="Pricing tiers">
      <div class="tier starter">
        <div>
          <strong>Starter</strong>
          <em>Core course + templates</em>
        </div>
        <div class="price">$40</div>
      </div>
      <div class="tier growth">
        <div>
          <strong>Growth</strong>
          <em>Prompt vault + 30-day calendar</em>
        </div>
        <div class="price">$100</div>
      </div>
      <div class="tier pro">
        <div>
          <strong>Pro</strong>
          <em>Monetization playbook + funnel pack</em>
        </div>
        <div class="price">$200</div>
      </div>
    </section>

    <p class="sub">No coding. Clear system. Start this week.</p>
    <div class="cta">Enroll on Gumroad</div>
    <div class="footer">Educational content only. Results vary. No guaranteed income.</div>
    <div class="grain"></div>
  </main>
</body>
</html>
