<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHIEF Reel Visual</title>
  <style>
    :root {
      --bg-1: #0b121f;
      --bg-2: #102a43;
      --bg-3: #0f766e;
      --ink: #f8fafc;
      --accent: #f97316;
      --accent-2: #22d3ee;
      --gold: #fbbf24;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(900px 500px at 10% 20%, rgba(34, 211, 238, 0.22), transparent 60%),
        radial-gradient(700px 500px at 90% 80%, rgba(249, 115, 22, 0.22), transparent 60%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      color: var(--ink);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      overflow: hidden;
    }

    .phone {
      width: min(100vw, 1080px);
      aspect-ratio: 9 / 16;
      border-radius: 34px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
      isolation: isolate;
      background:
        radial-gradient(circle at 20% 15%, rgba(34, 211, 238, 0.25), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(251, 191, 36, 0.22), transparent 45%),
        linear-gradient(165deg, #071225 0%, #0d1f37 35%, #0a3f45 100%);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 54px 54px;
      animation: drift 18s linear infinite;
      opacity: 0.42;
    }

    .ring {
      position: absolute;
      width: 680px;
      height: 680px;
      border-radius: 50%;
      border: 2px solid rgba(34, 211, 238, 0.35);
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 3.8s ease-in-out infinite;
      filter: blur(0.2px);
    }

    .ring.two {
      width: 900px;
      height: 900px;
      border-color: rgba(251, 191, 36, 0.24);
      animation-delay: 0.8s;
    }

    .badge {
      position: absolute;
      top: 38px;
      left: 38px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: clamp(18px, 1.7vw, 26px);
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, rgba(249, 115, 22, 0.9), rgba(251, 191, 36, 0.9));
      color: #0b121f;
      text-transform: uppercase;
      font-weight: 900;
      z-index: 6;
    }

    .logo-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 4;
    }

    .logo {
      width: 42%;
      max-width: 430px;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.58));
      animation: bob 2.8s ease-in-out infinite;
    }

    .headline {
      position: absolute;
      left: 6.5%;
      right: 6.5%;
      top: 13.5%;
      z-index: 7;
      text-transform: uppercase;
      line-height: 0.94;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      animation: popIn 0.9s ease both;
    }

    .headline .line-1 {
      display: block;
      font-size: clamp(62px, 7.5vw, 116px);
      color: #e2e8f0;
    }

    .headline .line-2 {
      display: block;
      font-size: clamp(72px, 9vw, 138px);
      color: var(--gold);
    }

    .headline .line-3 {
      display: block;
      font-size: clamp(58px, 7.2vw, 108px);
      color: var(--accent-2);
    }

    .sub {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 18%;
      z-index: 7;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-size: clamp(26px, 2.6vw, 40px);
      font-weight: 700;
      line-height: 1.2;
      color: #e5edf7;
      text-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
      animation: riseIn 1s ease 0.2s both;
    }

    .cta {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      z-index: 8;
      font-size: clamp(24px, 2.4vw, 36px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 900;
      padding: 14px 28px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      background: rgba(11, 18, 31, 0.38);
      backdrop-filter: blur(4px);
      animation: blink 1.2s steps(2) infinite;
    }

    .ticker {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 0;
      background: rgba(1, 7, 18, 0.78);
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      z-index: 9;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      white-space: nowrap;
      text-transform: uppercase;
      font-weight: 800;
      color: #dbeafe;
      letter-spacing: 0.05em;
      font-size: clamp(16px, 1.5vw, 22px);
    }

    .ticker span {
      display: inline-block;
      padding-left: 100%;
      animation: ticker 14s linear infinite;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 0.6px, transparent 0.6px);
      background-size: 3px 3px;
      opacity: 0.06;
      mix-blend-mode: soft-light;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-54px); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.45; }
      50% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.9; }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-16px) scale(1.03); }
    }

    @keyframes popIn {
      from {
        transform: translateY(-14px) scale(0.96);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes riseIn {
      from {
        transform: translateY(26px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.68; }
    }

    @keyframes ticker {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    @media (max-width: 740px) {
      .phone {
        width: 100vw;
        border-radius: 0;
      }

      .badge {
        top: 22px;
        left: 22px;
      }

      .headline {
        top: 12%;
      }

      .logo {
        width: 52%;
      }

      .sub {
        bottom: 17%;
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="CHIEF Instagram reel visual">
    <div class="grid"></div>
    <div class="ring"></div>
    <div class="ring two"></div>
    <div class="badge">CHIEF ON BASE</div>

    <h1 class="headline">
      <span class="line-1">Stop</span>
      <span class="line-2">Scrolling</span>
      <span class="line-3">Watch This</span>
    </h1>

    <div class="logo-wrap">
      <img class="logo" src="../chief-coin-256.png" alt="CHIEF token logo" />
    </div>

    <p class="sub">
      New utility energy. Real community momentum.<br />
      Follow early. Build with us.
    </p>

    <div class="cta">Follow @OfficialCHIEF</div>

    <div class="ticker">
      <span>CHIEF | COMMUNITY DRIVEN | BUILT ON BASE | CHIEF | COMMUNITY DRIVEN | BUILT ON BASE | CHIEF | COMMUNITY DRIVEN | BUILT ON BASE | </span>
    </div>

    <div class="grain"></div>
  </main>
</body>
</html>
