<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="140 150 745 620" role="img" aria-label="CHIEF mascot icon">
  <defs>
    <radialGradient id="furCore" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#f7d9a8"/>
      <stop offset="55%" stop-color="#d9974f"/>
      <stop offset="100%" stop-color="#96591f"/>
    </radialGradient>
    <radialGradient id="furJowl" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#f2ca92"/>
      <stop offset="100%" stop-color="#b87a3a"/>
    </radialGradient>
    <linearGradient id="mascotRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5d1"/>
      <stop offset="40%" stop-color="#f4bf57"/>
      <stop offset="100%" stop-color="#a44f00"/>
    </linearGradient>
    <radialGradient id="mascotShine" cx="22%" cy="16%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hatBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="hatBrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="snoutShade" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff1d6"/>
      <stop offset="100%" stop-color="#e8c592"/>
    </radialGradient>
  </defs>

  <!-- Ears -->
  <path d="M322,392 Q272,300 322,222 Q392,278 380,400 Q352,412 322,392 Z" fill="url(#furCore)" stroke="url(#mascotRim)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M702,392 Q752,300 702,222 Q632,278 644,400 Q672,412 702,392 Z" fill="url(#furCore)" stroke="url(#mascotRim)" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="345" cy="330" rx="20" ry="45" fill="#c17b3e" opacity="0.5"/>
  <ellipse cx="679" cy="330" rx="20" ry="45" fill="#c17b3e" opacity="0.5"/>

  <!-- Head base -->
  <ellipse cx="512" cy="478" rx="245" ry="222" fill="url(#furCore)" stroke="url(#mascotRim)" stroke-width="16"/>

  <!-- Jowls -->
  <ellipse cx="395" cy="560" rx="78" ry="92" fill="url(#furJowl)" stroke="url(#mascotRim)" stroke-width="11"/>
  <ellipse cx="629" cy="560" rx="78" ry="92" fill="url(#furJowl)" stroke="url(#mascotRim)" stroke-width="11"/>

  <!-- Snout -->
  <ellipse cx="512" cy="560" rx="120" ry="94" fill="url(#snoutShade)" stroke="url(#mascotRim)" stroke-width="10"/>

  <!-- Eyes -->
  <ellipse cx="430" cy="438" rx="36" ry="38" fill="#1a0f04"/>
  <ellipse cx="594" cy="438" rx="36" ry="38" fill="#1a0f04"/>
  <ellipse cx="418" cy="422" rx="12" ry="14" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="582" cy="422" rx="12" ry="14" fill="#ffffff" opacity="0.95"/>
  <circle cx="440" cy="450" r="6" fill="#ffb347" opacity="0.8"/>
  <circle cx="604" cy="450" r="6" fill="#ffb347" opacity="0.8"/>

  <!-- Blush -->
  <ellipse cx="368" cy="512" rx="32" ry="17" fill="#ff8c42" opacity="0.4"/>
  <ellipse cx="656" cy="512" rx="32" ry="17" fill="#ff8c42" opacity="0.4"/>

  <!-- Nose -->
  <ellipse cx="512" cy="532" rx="40" ry="30" fill="#231506"/>
  <ellipse cx="498" cy="521" rx="11" ry="8" fill="#ffffff" opacity="0.55"/>

  <!-- Mouth: open happy pant, tongue out -->
  <path d="M420,596 Q470,648 512,626 Q554,648 604,596 Q580,658 512,662 Q444,658 420,596 Z" fill="#3a1f0d"/>
  <rect x="493" y="602" width="16" height="20" rx="5" fill="#fff9e6"/>
  <rect x="515" y="602" width="16" height="20" rx="5" fill="#fff9e6"/>
  <path d="M552,626 Q590,636 592,672 Q594,708 566,714 Q542,716 536,684 Q530,650 552,626 Z" fill="#ff8c9a" stroke="#e0637a" stroke-width="3"/>

  <!-- Fitted cap -->
  <path d="M288,352 Q300,232 512,208 Q724,232 736,352 Q724,388 680,392 L344,392 Q300,388 288,352 Z"
        fill="url(#hatBody)" stroke="url(#mascotRim)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M292,390 Q512,352 732,390 Q736,420 700,428 L324,428 Q288,420 292,390 Z"
        fill="url(#hatBrim)" stroke="url(#mascotRim)" stroke-width="8" stroke-linejoin="round"/>
  <text x="512" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="3" fill="url(#mascotRim)">CHIEF</text>
  <circle cx="512" cy="216" r="12" fill="url(#mascotRim)"/>

  <ellipse cx="410" cy="410" rx="150" ry="96" fill="url(#mascotShine)"/>
</svg>
