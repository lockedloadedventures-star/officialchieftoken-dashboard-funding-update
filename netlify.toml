[build]
  publish = "web"

[[redirects]]
  from = "/"
  to = "/launch.html"
  status = 200

[[redirects]]
  from = "/deck"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/app.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Content-Type = "text/css; charset=UTF-8"
